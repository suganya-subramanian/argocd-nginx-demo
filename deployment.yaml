apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-nginx-demo
  namespace: argocd-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: argocd-nginx-demo
  template:
    metadata:
      labels:
        app: argocd-nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
